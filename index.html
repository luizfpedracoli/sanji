<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Cobrinha no GitHub</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { border: 2px solid #fff; background: #000; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Jogo da Cobrinha</h1>
    <canvas id="stage" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        document.addEventListener('keydown', keyPush);

        let velocity = { x: 0, y: 0 };
        let position = { x: 10, y: 10 };
        const grid = 20;
        const count = 20;
        let trail = [];
        let tail = 5;
        let apple = { x: 15, y: 15 };

        function game() {
            position.x += velocity.x;
            position.y += velocity.y;

            if (position.x < 0) position.x = count - 1;
            if (position.x > count - 1) position.x = 0;
            if (position.y < 0) position.y = count - 1;
            if (position.y > count - 1) position.y = 0;

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f00';
            ctx.fillRect(apple.x * grid, apple.y * grid, grid - 2, grid - 2);

            ctx.fillStyle = '#0f0';
            for (let i = 0; i < trail.length; i++) {
                ctx.fillRect(trail[i].x * grid, trail[i].y * grid, grid - 2, grid - 2);
                if (trail[i].x === position.x && trail[i].y === position.y) {
                    tail = 5;
                }
            }

            trail.push({ x: position.x, y: position.y });
            while (trail.length > tail) {
                trail.shift();
            }

            if (apple.x === position.x && apple.y === position.y) {
                tail++;
                apple.x = Math.floor(Math.random() * count);
                apple.y = Math.floor(Math.random() * count);
            }
        }

        setInterval(game, 1000 / 10);

        function keyPush(evt) {
            switch (evt.keyCode) {
                case 37: velocity = { x: -1, y: 0 }; break; // Esquerda
                case 38: velocity = { x: 0, y: -1 }; break; // Cima
                case 39: velocity = { x: 1, y: 0 }; break;  // Direita
                case 40: velocity = { x: 0, y: 1 }; break;  // Baixo
            }
        }
    </script>
</body>
</html>
