<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Plataforma 2D</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      border: 3px solid #fff;
      background: #1a1a2e;
    }
    .instrucoes {
      margin-top: 10px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <h1>Jogo de Plataforma 2D</h1>
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <div class="instrucoes">Controles: Setas Esquerda/Direita (ou A/D) para andar | Seta Cima/Espaço para pular</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Estado do Jogo
let pontuacao = 0;
let gameOver = false;

// Teclas pressionadas
const keys = {};

// Jogador
const player = {
  x: 50,
  y: 300,
  width: 30,
  height: 40,
  speed: 4,
  vx: 0,
  vy: 0,
  gravity: 0.5,
  jumpStrength: -10,
  grounded: false
};

// Plataformas (x, y, largura, altura)
const platforms = [
  { x: 0, y: 360, width: 800, height: 40 },  // Chão
  { x: 150, y: 280, width: 120, height: 15 },
  { x: 350, y: 210, width: 150, height: 15 },
  { x: 580, y: 150, width: 120, height: 15 },
  { x: 100, y: 130, width: 100, height: 15 }
];

// Moedas (x, y, raio, coletada)
const coins = [
  { x: 200, y: 240, radius: 8, collected: false },
  { x: 420, y: 170, radius: 8, collected: false },
  { x: 640, y: 110, radius: 8, collected: false },
  { x: 140, y: 90, radius: 8, collected: false }
];

// Inimigo
const enemy = {
  x: 350,
  y: 190,
  width: 25,
  height: 20,
  vx: 2,
  minX: 350,
  maxX: 475
};

// Listeners de teclado
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Loop Principal
function update() {
  if (gameOver) return;

  // Movimento do Jogador
  if (keys['ArrowRight'] || keys['KeyD']) {
    player.vx = player.speed;
  } else if (keys['ArrowLeft'] || keys['KeyA']) {
    player.vx = -player.speed;
  } else {
    player.vx = 0;
  }

  // Pulo
  if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
    player.vy = player.jumpStrength;
    player.grounded = false;
  }

  // Aplica Gravidade
  player.vy += player.gravity;

  // Atualiza Posição
  player.x += player.vx;
  player.y += player.vy;

  // Colisão com Limites do Canvas (Esquerda / Direita)
  if (player.x < 0) player.x = 0;
  if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

  // Colisão com Plataformas
  player.grounded = false;
  for (let plat of platforms) {
    if (
      player.x < plat.x + plat.width &&
      player.x + player.width > plat.x &&
      player.y + player.height <= plat.y + player.vy &&
      player.y + player.height + player.vy >= plat.y
    ) {
      player.grounded = true;
      player.vy = 0;
      player.y = plat.y - player.height;
    }
  }

  // Movimento do Inimigo
  enemy.x += enemy.vx;
  if (enemy.x <= enemy.minX || enemy.x + enemy.width >= enemy.maxX) {
    enemy.vx *= -1;
  }

  // Colisão com Inimigo
  if (
    player.x < enemy.x + enemy.width &&
    player.x + player.width > enemy.x &&
    player.y < enemy.y + enemy.height &&
    player.y + player.height > enemy.y
  ) {
    gameOver = true;
  }

  // Coleta de Moedas
  for (let coin of coins) {
    if (!coin.collected) {
      let dx = (player.x + player.width / 2) - coin.x;
      let dy = (player.y + player.height / 2) - coin.y;
      let distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < player.width / 2 + coin.radius) {
        coin.collected = true;
        pontuacao += 10;
      }
    }
  }

  draw();
  requestAnimationFrame(update);
}

// Renderização dos elementos na tela
function draw() {
  // Limpa o Canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Desenha Plataformas
  ctx.fillStyle = '#4e54c8';
  for (let plat of platforms) {
    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
  }

  // Desenha Moedas
  ctx.fillStyle = '#ffd700';
  for (let coin of coins) {
    if (!coin.collected) {
      ctx.beginPath();
      ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Desenha Inimigo
  ctx.fillStyle = '#ff4757';
  ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

  // Desenha Jogador
  ctx.fillStyle = '#2ed573';
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // Interface de Pontuação
  ctx.fillStyle = '#fff';
  ctx.font = '18px Arial';
  ctx.fillText('Pontos: ' + pontuacao, 15, 25);

  // Tela de Game Over
  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff4757';
    ctx.font = '36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

    ctx.fillStyle = '#fff';
    ctx.font = '18px Arial';
    ctx.fillText('Recarregue a página para jogar novamente', canvas.width / 2, canvas.height / 2 + 30);
  }
}

// Inicia o Loop do Jogo
update();
</script>
</body>
</html>
